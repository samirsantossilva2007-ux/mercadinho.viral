<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Página não encontrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap">
<style>
:root{color-scheme:light;--creme:#FFF4E2;--tomate:#E8382B;--tinta:#2B1A12;--tinta-2:#6B5244}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--creme);color:var(--tinta);
  font:17px/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;
  padding:32px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px))}
.caixa{text-align:center;max-width:44ch}
.num{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(5rem,20vw,9.5rem);
  line-height:.9;letter-spacing:-.04em;color:var(--tomate);text-shadow:0 5px 0 rgba(43,26,18,.12)}
h1{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(1.4rem,5vw,2.2rem);
  line-height:1.1;margin:10px 0 12px;text-wrap:balance}
p{color:var(--tinta-2);font-weight:600;margin:0}
</style>
</head>
<body>
  <div class="caixa">
    <div class="num">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou foi movido.</p>
  </div>
</body>
</html>
